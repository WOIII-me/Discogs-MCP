name: Release extension

# Attaches a load-ready Chrome extension zip (manifest.json at the archive root) to
# every ext-v* release. Without it the only download is GitHub's "Source code (zip)",
# which is repo-rooted and fails to load — see issue #38.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing ext-v* release tag to attach the zip to
        required: true

permissions:
  contents: read

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'ext-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package:ext
      - run: gh release upload "$TAG" dist/*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
